[package]
name = "astryx-dioxus"
version = "0.1.0"
edition = "2024"
description = "Astryx UI components for Dioxus"
publish = false

[dependencies]
dioxus = { version = "0.7.3", default-features = false, features = ["lib"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "Event", "EventTarget", "MouseEvent", "MouseEventInit", "PointerEvent", "KeyboardEvent", "Selection", "Location", "FocusOptions"] }

[dev-dependencies]
dioxus = { version = "0.7.3", features = ["web"] }
dioxus-ssr = "0.7.3"

[[example]]
name = "showcase"
path = "examples/showcase.rs"
